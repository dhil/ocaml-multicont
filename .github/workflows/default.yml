name: Multicont build, install, and tests

on:
  pull_request:
    branches: main
  push:
    branches: [main]
  schedule:
    # Prime the caches every Monday
    - cron: 0 1 * * MON

jobs:
  examples:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        ocaml-compiler:
          - 5.1.1
          - 5.2.0
          - 5.3.0

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          opam-depext: false

      - name: Install dune
        run: opam install dune dune-configurator
        shell: bash

      - name: Install library
        run: |
          opam exec -- dune build
          opam exec -- dune install
        shell: bash

      - name: Run tests
        run: |
          opam exec -- dune build @runtest
          opam exec -- dune build @runtest
        shell: bash

      - name: Clean & uninstall
        run: |
          opam exec -- dune uninstall
          opam exec -- dune clean
        shell: bash

      - name: Rebuild library with UNIQUE_FIBERS
        run: |
          opam exec -- dune build
          opam exec -- dune install
        env:
          UNIQUE_FIBERS: 1
        shell: bash

      - name: Rerun tests
        run: |
          opam exec -- dune build @runtest
          opam exec -- dune build @runtest
        shell: bash
